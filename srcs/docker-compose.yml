services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: on-failure

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
      - redis
    restart: on-failure

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - inception
    depends_on:
      - mariadb

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    container_name: redis
    volumes:
      - rds_data:/data
    restart: on-failure
    networks:
      - inception
    ports:
      - "6379:6379"

  website:
    build:
      context: ./requirements/bonus/website
    image: website
    container_name: website
    restart: on-failure
    networks:
      - inception
    ports:
      - "4242:4242"

  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    environment:
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-127.0.0.1}
    volumes:
      - wp_data:/var/www/html
    secrets:
      - ftp_password
    networks:
      - inception
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    depends_on:
      - wordpress
    restart: on-failure

  netdata:
      build: 
        context: ./requirements/bonus/netdata
      image: netdata
      container_name: netdata
      cap_add:
          - SYS_PTRACE
      volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      pid: host
      networks:
        - inception
      ports:
          - "19999:19999"
      restart: on-failure


volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  rds_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/redis
  netdataconfig:
  netdatalib:
  netdatacache:


networks:
  inception:
    driver: bridge


secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
